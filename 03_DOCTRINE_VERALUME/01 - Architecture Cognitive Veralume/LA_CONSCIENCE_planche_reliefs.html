:root{
  --entour:#BFC0B6; --page:#E4E4DB; --encre:#1F1F1A; --encre-doux:#5A594D;
  --braise:#8A6224; --incision:rgba(26,26,20,.42); --lumiere:rgba(255,255,248,.95);
  --relief-fond:#D9D9CD; --relief-trait:#6F6C5D; --filet:rgba(31,31,26,.16);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-nuit]{
  --entour:#0C0E11; --page:#171A1E; --encre:#CFCABC; --encre-doux:#8B8577;
  --braise:#D2954A; --incision:rgba(0,0,0,.8); --lumiere:rgba(255,240,214,.16);
  --relief-fond:#1D2127; --relief-trait:#7E8896; --filet:rgba(207,202,188,.15);
}
*{box-sizing:border-box}
body{margin:0;background:var(--entour);color:var(--encre);font-family:var(--serif);line-height:1.7}
.sprite{position:absolute;width:0;height:0}
header{max-width:70rem;margin:0 auto;padding:3.5rem 1.5rem 1.5rem;display:flex;align-items:flex-end;
  gap:1.5rem;flex-wrap:wrap}
header h1{font-size:1.5rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;margin:0;flex:1}
header p{margin:.4rem 0 0;color:var(--encre-doux);font-size:.9rem;width:100%;max-width:44rem}
.btn{appearance:none;background:none;border:1px solid var(--filet);color:var(--encre-doux);
  font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;padding:.4rem .7rem;border-radius:2px;cursor:pointer}
.btn:hover{color:var(--braise);border-color:var(--braise)}
main{max-width:76rem;margin:0 auto;padding:1rem 1.5rem 5rem;
  display:grid;gap:1px;background:var(--filet);
  grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));border:1px solid var(--filet)}
.carte{margin:0;background:var(--page);padding:1.5rem 1.5rem 1.7rem}
.haut{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;
  padding-bottom:.9rem;border-bottom:1px solid var(--filet)}
.bas{display:flex;align-items:center;gap:1.2rem;padding-top:1.1rem}
.paire{display:flex;align-items:center;gap:.7rem;flex:none}
.no{font-family:var(--mono);font-size:.78rem;color:var(--braise);letter-spacing:.06em}
.glyphe{display:grid;place-items:center;border-radius:50%;color:var(--relief-trait);
  background:var(--relief-fond);
  box-shadow:inset 1.5px 1.5px 3px var(--incision),inset -1.5px -1.5px 3px var(--lumiere),0 1px 0 var(--lumiere)}
.glyphe svg{width:64%;height:64%;display:block;
  filter:drop-shadow(-.6px -.6px 0 var(--incision)) drop-shadow(.6px .6px 0 var(--lumiere))}
.glyphe.grand{width:76px;height:76px}
.glyphe.petit{width:36px;height:36px}
figcaption{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.haut b{font-weight:400;font-size:1.05rem;flex:1}
.cle,.ou,.mots{font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;color:var(--encre-doux)}
.cle{color:var(--braise);text-transform:uppercase;letter-spacing:.16em}
.mots{opacity:.62;line-height:1.6;margin-top:.25rem}
</style></head>

<header>
  <h1>Planche des reliefs</h1>
  <button class="btn" onclick="document.documentElement.toggleAttribute('data-nuit')">Jour / nuit</button>
  <p>Vingt-six formes gravées. Chacune se modifie seule, sans toucher aux autres.
     Grand format = tête de chapitre et ouverture de livre. Petit format = marge.
     Sous chaque nom : les mots du texte qui la déclenchent en marge.</p>
</header>
