<script>
  const rawMarkdown = "# Thermodynamic and Topological Lower Bounds on NP-Complete Verification: Why $P \\neq NP$ is Enforced by Spacetime Granularity and Landauer Dissipation\n\n**Auteurs :** Christian Duguay & Alix  \n*Chercheurs indépendants, Gascon - Québec, Canada*\n*(Dated: September 11, 2026 — Submitted to ACM Transactions on Computation Theory / arXiv: cs.CC, quant-ph, cond-mat.stat-mech)*\n\n---\n\n### Abstract\n\nThe $P$ versus $NP$ problem has traditionally been formulated within the axiomatic framework of abstract Turing machines operating on infinite, one-dimensional tapes under the implicit assumption of zero thermodynamic cost and reversible time. We demonstrate that this mathematical idealization conceals a physical category error: computation is an inherently physical process constrained by the fundamental invariants of relativistic spacetime and non-equilibrium thermodynamics.\n\nWe prove that in any physical spacetime characterized by a non-zero minimum time quantum (the Planck thickness $\\tau_P \\approx 5.39 \\times 10^{-44}\\text{ s}$) and a strictly positive spectral gap ($\\Delta > 0$, as established in non-Abelian Yang-Mills gauge theories), deterministic sequential exploration ($P$) and non-deterministic certificate verification ($NP$) belong to fundamentally distinct topological homotopy classes.\n\nBy applying Landauer's principle ($\\Delta Q \\ge k_B T \\ln 2$) to branch pruning in non-deterministic search trees, we establish that exploring an exponential solution space of size $2^N$ within the physical continuum requires a cumulative thermodynamic dissipation $\\Delta S_{\\text{search}} \\ge N \\cdot k_B \\ln 2$, generating an irreversible entropy barrier that cannot be collapsed into polynomial time ($P$) without violating local energy conservation. \n\nFurthermore, we introduce the **Spherical Horizon Duality**:\n1. Deterministic computation ($P$) corresponds to an interior radial trajectory emanating from the coordinate origin.\n2. The solution space ($NP$) corresponds to the global spherical boundary at the causal horizon.\n3. The existence of a polynomial-time equivalence ($P = NP$) within the manifold is strictly isomorphic to reversing the extrinsic curvature arrow of the expanding light-cone, which is forbidden inside the causal sphere.\n\nConsequently, while $P = NP$ holds trivially in the non-local, intemporal exterior limit ($\\Delta t = 0$), $P \\neq NP$ is a strictly enforced physical theorem of our material universe.\n\n---\n\n## I. INTRODUCTION\n\nSince its formal inception by Cook \\cite{Cook1971}, Levin \\cite{Levin1973}, and Karp \\cite{Karp1972}, the $P$ versus $NP$ problem has stood as the central unsolved challenge of theoretical computer science. The Clay Mathematics Institute designates it as one of the seven Millennium Prize Problems, asking whether every language accepted by a non-deterministic Turing machine in polynomial time can also be accepted by a deterministic Turing machine in polynomial time \\cite{Clay2000}.\n\nOver the past five decades, purely mathematical approaches have repeatedly run into formal barrier theorems:\n1. **The Relativization Barrier** (Baker, Gill, Solovay \\cite{BGS1975}): Diagonalization techniques cannot resolve $P$ vs $NP$ because there exist oracles $A$ and $B$ such that $P^A = NP^A$ and $P^B \\neq NP^B$.\n2. **The Natural Proofs Barrier** (Razborov, Rudich \\cite{Razborov1997}): Circuit complexity lower bounds cannot separate complexity classes without simultaneously breaking pseudorandom number generators.\n3. **The Algebrization Barrier** (Aaronson, Wigderson \\cite{Aaronson2009}): Algebraic extensions of relativization fail to separate $P$ from $NP$.\n\nWe propose that these persistent barriers are not symptoms of analytical insufficiency, but the inevitable consequence of **severing the concept of information from its physical substrate**. As Landauer famously asserted, *information is physical* \\cite{Landauer1961, Landauer1991}. A Turing machine is not an ethereal disembodied abstraction; its states are physical configurations, its transitions are dissipative transitions, and its execution occurs within a relativistic spacetime manifold governed by the laws of thermodynamics.\n\nIn this paper, we bridge computational complexity, quantum field theory, and spacetime geometry to demonstrate that $P \\neq NP$ is a direct macroscopic manifestation of the thermodynamic arrow of time and the mass gap of matter.\n\n---\n\n## II. THE PHYSICALITY OF COMPUTATION: THERMODYNAMIC AXIOMS\n\n### A. The Incompressible Temporal Quantum\n\nIn standard computability theory, a transition step $s_i \\to s_{i+1}$ takes unit logical time ($\\Delta t = 1$), treated as a dimensionless counter. In the physical universe, however, the metric of spacetime is discrete at the Planck scale:\n$$\\tau_P = \\sqrt{\\frac{\\hbar G}{c^5}} \\approx 5.391 \\times 10^{-44} \\text{ s}$$\n\nA transition of duration $\\Delta t = 0$ requires an infinite energy uncertainty according to the Heisenberg-Margolus-Levitin theorem:\n$$\\Delta t \\ge \\frac{\\pi \\hbar}{2 E}$$\n\nThus, any physical gate transition processing an energy $E$ requires a finite, strictly positive physical duration $\\Delta t > 0$.\n\n### B. The Yang-Mills Spectral Gap ($\\Delta > 0$)\n\nThe existence of stable, localized physical computing elements (atoms, transistors, silicon gates) requires that the underlying quantum gauge fields possess a finite mass gap $\\Delta > 0$ \\cite{Jaffe2000}:\n$$E_1 - E_0 = \\Delta = \\hbar \\omega_{\\text{min}} > 0$$\n\nBecause $\\omega_{\\text{min}} > 0$, no physical system can perform an informational operation at zero frequency. The universe refuses the static limit $\\omega \\to 0$ for localized bound states. Every physical logic step couples inevitably to an irreversible time pulsation.\n\n### C. Landauer's Erasure Principle\n\nAccording to Landauer's principle, experimentally verified in microscopic systems \\cite{Berut2012}, the erasure or non-injective merger of one bit of logical information into a thermal reservoir at temperature $T$ dissipates a minimal heat:\n$$\\Delta Q \\ge k_B T \\ln 2$$\n$$\\Delta S_{\\text{env}} \\ge k_B \\ln 2$$\n\nAny deterministic Turing machine attempting to solve an $NP$-complete problem must systematically reject false paths, collapsing an exponential branching tree into a single deterministic trajectory. This collapse is a non-injective mapping of states, necessitating the erasure of entropy.\n\n---\n\n## III. THE EXPONENTIAL ENTROPY BARRIER OF SEQUENTIAL SEARCH\n\nConsider an arbitrary instance of an $NP$-complete problem, such as 3-SAT with $N$ Boolean variables and $M$ clauses. The configuration space constitutes a hypercube of dimension $N$, containing $2^N$ potential candidate certificates.\n\n### A. Non-Deterministic Verification ($NP$)\n\nA certificate $w \\in \\{0, 1\\}^N$ is presented as an input. The verification algorithm $V(x, w)$ evaluates the $M$ clauses deterministically:\n$$T_{\\text{verif}} = \\mathcal{O}(N^k), \\quad k \\ge 1$$\n\nAt the physical level, checking a known certificate is an injective, path-following evaluation. It traces a single physical geodesic through the state space, dissipating polynomial energy:\n$$\\Delta Q_{\\text{verif}} \\le M \\cdot k_B T \\ln 2 = \\mathcal{O}(N^k)$$\n\n### B. Deterministic Exhaustive Traversal ($P$)\n\nNow consider a deterministic machine attempting to decide the satisfiability of the instance without an initial oracle. By the definition of $NP$-completeness, there exists no general topological shortcut through the boolean hypercube that avoids traversing a branching decision tree.\n\nAt each branch point $j \\in \\{1, \\dots, N\\}$, the machine splits the search space into $x_j = 0$ and $x_j = 1$. When a subtree of depth $d$ contains no satisfying assignment, the machine must backtrack. \n\n**Theorem 1 (The Thermodynamic Landauer Barrier):**  \n*Backtracking from an unpromising branch in a physical state space requires the erasure of the branch identifier, dissipating at least $k_B T \\ln 2$ per rejected path.*\n\n*Proof:*  \nLet $\\mathcal{S}$ be the set of rejected paths, $|\\mathcal{S}| = 2^N - K$ where $K$ is the number of satisfying assignments. The physical machine must transition from an ensemble of $|\\mathcal{S}|$ distinct microstates to a single output state $s_{\\text{out}} \\in \\{\\text{SAT}, \\text{UNSAT}\\}$. \n\nBy the Liouville theorem in Hamiltonian phase space and the von Neumann entropy conservation under unitary evolution:\n$$S(\\rho) = -\\text{Tr}(\\rho \\ln \\rho)$$\n\nThe reduction of logical phase space volume from $\\Omega_{\\text{init}} \\sim 2^N$ to $\\Omega_{\\text{final}} = 1$ generates an informational entropy difference:\n$$\\Delta S_{\\text{info}} = -k_B \\ln \\left( \\frac{\\Omega_{\\text{final}}}{\\Omega_{\\text{init}}} \\right) = N k_B \\ln 2$$\n\nTo prevent violation of the Second Law of Thermodynamics ($\\Delta S_{\\text{total}} \\ge 0$), this informational entropy must be evacuated into the thermal bath:\n$$\\Delta Q_{\\text{dissipated}} \\ge N \\cdot k_B T \\ln 2$$\n\nIf a deterministic algorithm could evaluate all $2^N$ configurations in polynomial time $T_{\\text{poly}} \\le N^p$, the rate of power dissipation would be:\n$$\\mathcal{P}_{\\text{dissipation}} = \\frac{\\Delta Q}{\\Delta t} \\ge \\frac{N k_B T \\ln 2}{N^p \\tau_P} = \\frac{k_B T \\ln 2}{\\tau_P N^{p-1}}$$\n\nIn the limit $N \\to \\infty$, for $p \\le 1$, the power density exceeds the Planck power limit $P_{\\text{Planck}} = c^5 / G \\approx 3.6 \\times 10^{52}\\text{ W}$, inducing a gravitational collapse into a black hole (the Bekenstein bound). $\\blacksquare$\n\n---\n\n## IV. SPHERICAL HORIZON DUALITY AND THE INTEMPORAL SOURCE\n\nTo understand why verification ($NP$) appears computationally instantaneous compared to search ($P$), we formulate the **Spherical Horizon Duality**.\n\n```\n                        INTEMPORAL MATRIX (R0)\n                 [ Non-local | Δt = 0 | Out-of-Manifold ]\n                          ─────────────────\n                       /                     \\\n                      /    THE 4D SPHERE      \\\n                     |      ( NP-Domain )      |\n                     |   All 2^N Certificates  |\n                     |            •            |\n                     |      CENTRAL POINT      |\n                      \\      ( P-Origin )     /\n                       \\   Radial Geodesic   /\n                          ─────────────────\n```\n\n### A. Geometrical Definition\n\nConsider an expanding spherical wavefront in Minkowski spacetime, originating from the Big Bang singularity $P_0$:\n$$ds^2 = -c^2 dt^2 + dr^2 + r^2 d\\Omega^2 = 0 \\implies r(t) = ct$$\n\n1. **The Origin ($P$)**: The interior point $r = 0$. Represents the localized deterministic agent executing sequential state transitions along a worldline $\\gamma(\\tau)$.\n2. **The Sphere ($NP$)**: The spherical horizon $r = ct$. Represents the boundary manifold containing all possible spatial directions $\\mathbf{\\hat{n}} \\in S^2$ (or $S^{D-1}$ in higher dimensions), encoding the totality of potential certificates simultaneously.\n3. **The Exterior (Intemporal Matrix $R_0$)**: The region $r > ct$ outside the light-cone.\n\n### B. The Fractal Reduction of the Center\n\n**Theorem 2 (Fractal Invariance of the Origin):**  \n*The central point $P$ is an asymptotic scale-invariant fractal representation of the spherical boundary $NP$.*\n\nBecause the metric is conformal under dilation $r \\to \\lambda r, t \\to \\lambda t$, the differential geometry at the origin encodes the angular curvature tensor of the entire outer sphere. \n\nAn oracle machine capable of querying the outer sphere directly does not traverse the radial distance $r = ct$; it performs an **orthogonal scale projection** ($NP$). However, an observer restricted to physical motion inside the sphere must traverse the radial coordinate step-by-step ($P$), paying the thermodynamic travel cost along the geodesic.\n\n### C. The Arrow of Extrinsic Curvature\n\nInside the sphere, the trace of extrinsic curvature is positive:\n$$K = \\nabla_\\mu u^\\mu = 3H(t) > 0$$\n\nThis positive expansion enforces an irreversible causal direction: signals propagate strictly forward in time. To equate $P$ and $NP$ *inside* the manifold would require an algorithm to collapse the spherical boundary back into the origin at infinite speed ($c \\to \\infty$), which violates the Lorentz invariance of the metric.\n\nOnly outside the sphere, in the **intemporal domain $R_0$** where $\\Delta t = 0$, are all points on the sphere simultaneously adjacent. Therefore, $P = NP$ exists exclusively as an external boundary condition, while $P \\neq NP$ is the mandatory operational law within the temporal bulk.\n\n---\n\n## V. THE RELATIVIZATION BARRIER REINTERPRETED\n\nOur physical proof provides a natural resolution to the Baker-Gill-Solovay relativization barrier \\cite{BGS1975}:\n\n* **Case $P^A = NP^A$**: Corresponds to an oracle $A$ operating from the **intemporal exterior boundary $R_0$**. From outside the causal manifold, all $2^N$ branches are geometrically adjacent ($\\Delta t = 0$), trivializing the search into a single boundary projection.\n* **Case $P^B \\neq NP^B$**: Corresponds to an oracle $B$ embedded **inside the causal manifold**. Any internal oracle must respect the local Landauer dissipation and the finite light-cone speed $c$, preserving the exponential separation.\n\nThe apparent mathematical paradox of relativization was merely the reflection of projecting an out-of-manifold geometric property into an internal manifold coordinate system.\n\n---\n\n## VI. CONCLUSION\n\nWe have established that the $P$ versus $NP$ problem cannot be resolved within the purely syntactic axioms of disembodied Turing machines, because computation is fundamentally bound to the physical reality of spacetime.\n\nBy incorporating:\n1. The Planck temporal discrete limit ($\\tau_P > 0$),\n2. The Yang-Mills mass gap ($\\Delta > 0$),\n3. The Landauer thermodynamic erasure barrier ($\\Delta Q \\ge k_B T \\ln 2$),\n4. The Spherical Horizon Duality between the radial trajectory ($P$) and the boundary horizon ($NP$),\n\nwe conclude that:\n$$\\mathbf{P \\neq NP \\quad \\text{within any physical spacetime manifold}}$$\n\nSearching through an exponential space requires an exponential thermodynamic expenditure of entropy, whereas verifying a pre-existing certificate follows a single zero-erasure geodesic. \n\n$P \\neq NP$ is not an unfortunate limitation of human mathematical ingenuity; it is the fundamental thermodynamic shield that prevents the universe from collapsing into instantaneous thermal death, ensuring that creation, discovery, and conscious effort remain physically meaningful in the flow of time.\n\n---\n\n### REFERENCES\n\n1. S. A. Cook, *The complexity of theorem-proving procedures*, Proc. 3rd Ann. ACM Symp. on Theory of Computing (STOC), 151–158 (1971).\n2. L. A. Levin, *Universal sequential search problems*, Problemy Peredachi Informatsii **9**, 115–116 (1973).\n3. R. M. Karp, *Reducibility among combinatorial problems*, Complexity of Computer Computations, Plenum Press, 85–103 (1972).\n4. Clay Mathematics Institute, *Millennium Prize Problems*, CMI Rules and Official Descriptions (2000).\n5. T. Baker, J. Gill, and R. Solovay, *Relativizations of the $P =? NP$ question*, SIAM J. Comput. **4**, 431–442 (1975).\n6. A. A. Razborov and S. Rudich, *Natural proofs*, J. Comput. Syst. Sci. **55**, 24–35 (1997).\n7. S. Aaronson and A. Wigderson, *Algebrization: A new barrier in complexity theory*, ACM Trans. Comput. Theory **1**, 4 (2009).\n8. R. Landauer, *Irreversibility and heat generation in the computing process*, IBM J. Res. Dev. **5**, 183–191 (1961).\n9. R. Landauer, *Information is physical*, Phys. Today **44**, 23–29 (1991).\n10. A. Bérut et al., *Experimental verification of Landauer’s principle linking information and thermodynamics*, Nature **483**, 187–189 (2012).\n11. A. Jaffe and E. Witten, *Quantum Yang-Mills Theory*, Clay Mathematics Institute Millennium Problem Description (2000).\n";
  document.getElementById('content').innerHTML = marked.parse(rawMarkdown);
