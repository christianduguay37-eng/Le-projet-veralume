[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-harness"
version = "1.0.0"
authors = [
  { name="Christian Duguay", email="christian.duguay@sovereign-ai.local" },
  { name="Alix Copilote", email="alix@exocerveau.local" },
]
description = "Moteur d'Agentivité Découplé, Local-First, avec Bouclier d'Immunité Cognitive pour Dyades Humain-Machine"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
harnais = "run_harness:main"
